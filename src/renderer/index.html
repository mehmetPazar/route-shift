<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>RouteShift</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Baslik -->
  <div class="header" id="header">
    <div class="header-row">
      <div id="dot" class="dot inactive"></div>
      <h1>RouteShift</h1>
    </div>
  </div>

  <!-- Butonlar -->
  <div class="buttons">
    <button id="btnOn" class="btn btn-on" title="Bypass aç">&#9654; Aç</button>
    <button id="btnOff" class="btn btn-off" disabled title="Bypass kapa">&#9632; Kapa</button>
    <button id="btnTest" class="btn btn-test" title="Bağlantı testi">&#128269; Test</button>
  </div>

  <!-- Tab bar -->
  <div class="tabs">
    <button class="tab active" data-tab="log">İşlem Kaydı</button>
    <button class="tab" data-tab="domains">Domains</button>
  </div>

  <!-- Tab: Islem Kaydi -->
  <div class="tab-content active" id="tab-log">
    <div class="log-header">
      <button id="btnClear" class="log-clear">Temizle</button>
    </div>
    <div id="log"></div>
  </div>

  <!-- Tab: Domains -->
  <div class="tab-content" id="tab-domains">
    <div class="domain-add">
      <input type="text" id="domainInput" placeholder="ornek.com" spellcheck="false">
      <button id="btnAddDomain" class="btn-add">+ Ekle</button>
    </div>
    <div id="domainList" class="domain-list"></div>
  </div>

  <!-- Alt bilgi -->
  <div class="footer">
    RouteShift v2.0
  </div>

  <script src="renderer.js"></script>
</body>
</html>
