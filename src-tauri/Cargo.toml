[package]
name = "routeshift"
version = "2.0.0"
description = "RouteShift - Belirli domainleri Wi-Fi uzerinden yonlendirir"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
native-tls = "0.2"
futures = "0.3"
dirs = "6"

